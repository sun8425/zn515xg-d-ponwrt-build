name: Build PonWrt (Airoha AN7581)

on:
  workflow_dispatch:
    inputs:
      target_device:
        description: '机型（必须是 an7581.mk 里 TARGET_DEVICES 之一）'
      core_profile:
        description: 'PassWall2 core 策略'
        required: true
        default: 'full'
        type: choice
        options:
          - none
          - lean
          - full
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    # GitHub 单 job 上限 360 分钟；full 策略要编 xray + sing-box + mihomo 三个
    # Go 核心（含 golang bootstrap），比 lean 慢得多，留足余量。
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo swapoff -a || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/lib/mono /usr/share/swift /usr/local/julia* /usr/lib/jvm /usr/local/graalvm
          sudo rm -rf /home/linuxbrew /usr/share/az* /opt/az /usr/local/share/powershell /usr/lib/postgresql
          sudo rm -rf /usr/local/share/chromium* /opt/microsoft
          sudo apt-get clean
          sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          git clone https://github.com/sun8425/ponwrt
          cd ponwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make -j$(nproc)

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-zn504xg
          path: out/*/
          if-no-files-found: error

      - name: Upload failure summary
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-summary
          path: out/*/failure-summary.txt
          if-no-files-found: warn

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: out/*/build.log
          if-no-files-found: warn
